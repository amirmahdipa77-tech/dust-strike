<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151109" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DUST STRIKE</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- ============ HUD ============ -->
    <div id="hud" class="hidden">
      <div id="crosshair">
        <i class="ch ch-t"></i><i class="ch ch-b"></i><i class="ch ch-l"></i><i class="ch ch-r"></i>
        <i id="ch-dot"></i>
      </div>

      <div id="vitals">
        <div class="vrow"><span class="vlabel">HP</span><span id="hp">100</span></div>
        <div class="bar"><i id="hpbar"></i></div>
      </div>

      <div id="ammo">
        <span id="mag">30</span><small id="reserve">/ 90</small>
        <div id="reloading" class="hidden">RELOADING</div>
      </div>

      <div id="score">
        <span class="sk">KILLS</span> <b id="kills">0</b> <span class="sep">/</span> <span id="target">15</span>
      </div>

      <div id="fps">60 FPS</div>
      <div id="feed"></div>
      <div id="hitmarker"></div>
      <button id="btn-pause" class="tbtn tiny">II</button>
    </div>

    <!-- ============ TOUCH ============ -->
    <div id="touch" class="hidden">
      <div id="stick"><div id="knob"></div></div>
      <button id="btn-fire" class="tbtn fire">FIRE</button>
      <button id="btn-jump" class="tbtn small">JUMP</button>
      <button id="btn-reload" class="tbtn small">RELOAD</button>
      <button id="btn-crouch" class="tbtn small">CROUCH</button>
    </div>

    <div id="vignette"></div>
    <div id="damage"></div>

    <!-- ============ SCREENS ============ -->
    <div id="start" class="overlay">
      <div class="panel">
        <div class="tag">v1 · mobile · landscape</div>
        <h1>DUST<span>STRIKE</span></h1>
        <p class="sub">5v5 gone solo — clear the site, hold the mid.</p>
        <button id="btn-play" class="big">TAP TO DEPLOY</button>
        <div class="hints">
          <div><b>MOVE</b> left thumb</div>
          <div><b>LOOK</b> right thumb</div>
          <div><b>FIRE</b> hold button</div>
          <div><b>GOAL</b> 15 kills</div>
        </div>
        <div class="foot">desktop: WASD · mouse · click to shoot</div>
      </div>
    </div>

    <div id="dead" class="overlay hidden">
      <div class="panel small">
        <h2>ELIMINATED</h2>
        <p class="sub">respawning…</p>
        <div class="timer" id="deadtimer">3</div>
      </div>
    </div>

    <div id="paused" class="overlay hidden">
      <div class="panel small">
        <h2>PAUSED</h2>
        <button id="btn-resume" class="big">RESUME</button>
        <button id="btn-restart" class="ghost">RESTART MATCH</button>
      </div>
    </div>

    <div id="win" class="overlay hidden">
      <div class="panel small">
        <h2 class="win">MISSION COMPLETE</h2>
        <p class="sub" id="winstats">15 kills</p>
        <button id="btn-again" class="big">PLAY AGAIN</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
